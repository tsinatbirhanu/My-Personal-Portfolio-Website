<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የመጽሐፍ ቅዱስ ጥያቄ እና መልስ (100 ጥያቄዎች በ4 ደረጃዎች)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a365d; /* ሰማያዊ ባግራውንድ */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        /* ከላይ በኩል የሚታየው ጽሁፍ */
        #banner-title {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            padding: 0 15px;
            line-height: 1.6;
        }

        #quiz-container {
            background-color: white;
            color: #333;
            padding: 25px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            width: 450px;
            max-width: 90%;
            text-align: center;
            position: relative;
        }

        /* User Header Info */
        #user-header {
            font-size: 14px;
            font-weight: bold;
            color: #2b6cb0;
            text-align: left;
            margin-bottom: 12px;
            display: none;
        }

        /* Top Panel Layout */
        #top-panel {
            display: none;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #4a5568;
            background-color: #f7fafc;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .score-correct {
            color: #38a169;
        }

        .score-wrong {
            color: #e53e3e;
        }

        #timer-display {
            font-size: 13px;
            color: #e53e3e;
            background-color: #fff5f5;
            padding: 3px 8px;
            border-radius: 10px;
            border: 1px solid #feb2b2;
        }

        #q-num-display {
            font-size: 13px;
            color: #2b6cb0;
            font-weight: bold;
            margin-bottom: 15px;
            background-color: #ebf8ff;
            padding: 6px 10px;
            border-radius: 6px;
            display: inline-block;
        }

        h2 {
            margin-top: 10px;
            margin-bottom: 20px;
            color: #333;
            font-size: 1.15rem;
            line-height: 1.5;
        }

        #name-input-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        input[type="text"] {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            outline: none;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #3182ce;
        }

        #start-btn {
            padding: 12px;
            background-color: #cbd5e0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: not-allowed;
            transition: background-color 0.3s;
        }

        #start-btn.active {
            background-color: #3182ce;
            cursor: pointer;
        }

        #start-btn.active:hover {
            background-color: #2b6cb0;
        }

        /* Level Selection Styles */
        #level-section {
            display: none;
            margin-top: 20px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .level-card {
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            padding: 15px 10px;
            background-color: #f7fafc;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .level-card.unlocked:hover {
            transform: translateY(-3px);
            border-color: #3182ce;
        }

        .level-card.locked {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #edf2f7;
        }

        .level-title {
            font-weight: bold;
            font-size: 15px;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .crosses {
            font-size: 18px;
            letter-spacing: 4px;
        }

        .cross-dim {
            color: #cbd5e0;
        }

        .cross-bright {
            color: #ecc94b;
            text-shadow: 0 0 5px rgba(236, 201, 75, 0.8);
        }

        /* Game Section Styles */
        #game-section {
            display: none;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #e2e8f0;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #cbd5e0;
        }

        .option-btn.correct {
            background-color: #48bb78 !important;
            color: white;
        }

        .option-btn.wrong {
            background-color: #f56565 !important;
            color: white;
        }

        .nav-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            display: none;
        }

        .nav-btn:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

    <!-- በሰማያዊው ባግራውንድ ላይ በነጭ ጽሁፍ የሚታየው ርዕስ -->
    <div id="banner-title">
        የዱ/ሀ/ቃ/ህ/ቤተክርስቲያን የተማሪዎች ህብረት የመፅሐፍ ቅዱስ ጥያቄ በተማሪ ፅናት ብርሃኑ የቀረበ
    </div>

    <div id="quiz-container">
        <!-- በግራ በኩል በላይ የሚታይ የስም ማሳያ -->
        <div id="user-header"></div>

        <!-- ከላይ በኩል ነጥብ እና ሰከንድ ማሳያ ፓነል -->
        <div id="top-panel">
            <span class="score-correct">ተመለሰ: <span id="correct-count">0</span></span>
            <span class="score-wrong">አልተመለሰም: <span id="wrong-count">0</span></span>
            <span id="timer-display">⏱ 30s</span>
        </div>

        <!-- ስም ማስገቢያ ክፍል -->
        <div id="name-section">
            <h2>እንኳን ደህና መጡ!</h2>
            <div id="name-input-container">
                <input type="text" id="username-input" placeholder="ስምዎን ያስገቡ" oninput="validateInput()">
                <button id="start-btn" onclick="goToLevelSelection()" disabled>ጀምር</button>
            </div>
        </div>

        <!-- የደረጃዎች መምረጫ ክፍል -->
        <div id="level-section">
            <h2 id="level-welcome-text">ደረጃ ይምረጡ</h2>
            <div class="level-grid">
                <div id="level-card-1" class="level-card unlocked" onclick="startLevel(1)">
                    <div class="level-title">ደረጃ 1</div>
                    <div id="crosses-1" class="crosses">
                        <span class="cross-dim">✝</span><span class="cross-dim">✝</span><span class="cross-dim">✝</span>
                    </div>
                </div>
                <div id="level-card-2" class="level-card locked" onclick="startLevel(2)">
                    <div class="level-title">ደረጃ 2</div>
                    <div id="crosses-2" class="crosses">
                        <span class="cross-dim">✝</span><span class="cross-dim">✝</span><span class="cross-dim">✝</span>
                    </div>
                </div>
                <div id="level-card-3" class="level-card locked" onclick="startLevel(3)">
                    <div class="level-title">ደረጃ 3</div>
                    <div id="crosses-3" class="crosses">
                        <span class="cross-dim">✝</span><span class="cross-dim">✝</span><span class="cross-dim">✝</span>
                    </div>
                </div>
                <div id="level-card-4" class="level-card locked" onclick="startLevel(4)">
                    <div class="level-title">ደረጃ 4</div>
                    <div id="crosses-4" class="crosses">
                        <span class="cross-dim">✝</span><span class="cross-dim">✝</span><span class="cross-dim">✝</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- የጨዋታው ክፍል -->
        <div id="game-section">
            <div id="q-num-display"></div>
            <h2 id="question-text">ጥያቄ እየተጫነ ነው...</h2>
            <div id="options-container"></div>
            <div>
                <button id="next-btn" class="nav-btn" onclick="nextQuestion()">ቀጣይ</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            // ደረጃ 1 (1-25) - ብሉይ ኪዳን ክፍል 1
            { question: "1. አዳምና ሄዋን የተፈጠሩበትና የተቀመጡበት ገነት ማን ይባላል?", options: ["የዔደን ገነት", "የገሊላ ገነት", "የሲና ገነት", "የዘይት ገነት"], correct: 0 },
            { question: "2. አዳምና ሄዋን ከእግዚአብሔር የታዘዙትን ትእዛዝ ተላልፈው የበሉት ፍሬ ምን ነበር?", options: ["የሕይወት ዛፍ", "መልካም፤ና ክፉን የሚያስታውቅ ዛፍ", "የበለስ ዛፍ", "የወይራ ዛፍ"], correct: 1 },
            { question: "3. እግዚአብሔር አዳምን ከምን ፈጠረው?", options: ["ከእሳት", "ከወርቅ", "ከመሬት አፈር", "ከውኃ"], correct: 2 },
            { question: "4. ሄዋን ከአዳም ከየትኛው የሰውነት ክፍል ተፈጠረች?", options: ["ከእጁ", "ከጎኑ አጥንት", "ከእግሩ", "ከተከሻው"], correct: 1 },
            { question: "5. ኖህ እግዚአብሔር ባዘዘው መሠረት የሰራው ትልቅ መርከብ ከምን እንጨት ተሰራ?", options: ["ከጎፈር እንጨት", "ከወይራ እንጨት", "ከዋርካ እንጨት", "ከጥርሴ እንጨት"], correct: 0 },
            { question: "6. በኖህ ዘመን የነበረው የጥፋት ውኃ ለስንት ቀንና ሌሊት ዘነበ?", options: ["7 ቀንና 7 ሌሊት", "40 ቀንና 40 ሌሊት", "100 ቀን", "120 ቀን"], correct: 1 },
            { question: "7. የጥፋት ውኃ መጎደሉን ለማወቅ ኖህ ከመልእክተኛው ቁራ በኋላ የላካት ወፍ ማን ነበረች?", options: ["ርግብ", "ጭልፊት", "ድንቢጥ", "ጉጉት"], correct: 0 },
            { question: "8. ከጥፋት ውኃ በኋላ እግዚአብሔር ለዓለም የገባውን ቃል ኪዳን ለማሳየት በደመና ያደረገው ምልክት ምንድን ነው?", options: ["ቀስተ ደመና", "ኮከብ", "የእሳት ዓምድ", "መብረቅ"], correct: 0 },
            { question: "9. የሳምሶን እናትና አባት የትኛው ነገድ ነበሩ?", options: ["የይሁዳ ነገድ", "የዳን ነገድ", "የብንያም ነገድ", "የሌዊ ነገድ"], correct: 1 },
            { question: "10. ሳምሶን በልጅነቱ እግዚአብሔር የተለየ ናዝራዊ እንዲሆን በመሆኑ ምን እንዲያደርግ አልተፈቀደለትም ነበር?", options: ["ጠጅ እንዲጠጣና ጸጉሩ እንዲላጭ", "ሥጋ እንዲበላ", "እንጀራ እንዲበላ", "ጫማ እንዲያደርግ"], correct: 0 },
            { question: "11. ሳምሶን ኃይሉ ያለው በየትኛው የሰውነት ክፍሉ ላይ ነበር?", options: ["በእጁ", "በጸጉሩ", "በእግሩ", "በደረቱ"], correct: 1 },
            { question: "12. ሳምሶንን አታልላ የኃይሉን ምስጢር ለፍልስጥኤማውያን አሳልፋ የሰጠችው ሴት ማን ትባላለች?", options: ["ደሊላ", "ሬካብ", "ሩት", "አስቴር"], correct: 0 },
            { question: "13. ሙሴ እስራኤላውያንን ከግብጽ ባርነት ሲያወጣ የቀይ ባሕርን የከፈለው በምን ነበር?", options: ["በእጁ", "በበትሩ", "በድንጋይ", "በሰይፍ"], correct: 1 },
            { question: "14. እግዚአብሔር ለሙሴ አሥርቱን ትእዛዛት የሰጠው በየትኛው ተራራ ላይ ነው?", options: ["በሲና ተራራ", "በጽዮን ተራራ", "በደብረ ዘይት ተራራ", "በቀርሜሎስ ተራራ"], correct: 0 },
            { question: "15. ሙሴ እግዚአብሔርን በመጀመሪያ ያየው በምን መልክ ነበር?", options: ["በደመና", "በሚነድ እሾህ ቁጥቋጦ ውስጥ", "በውኃ ላይ", "በታላቅ ነፋስ"], correct: 1 },
            { question: "16. እስራኤላውያን በምድረ በዳ ጉዞአቸው ወቅት እግዚአብሔር ከሰማይ ያወረደላቸው ምግብ ምን ይባላል?", options: ["መና", "በለስ", "ዘቢብ", "ኅብስት"], correct: 0 },
            { question: "17. አብርሃም እግዚአብሔርን ታዝዞ ልጁን ይስሐቅን መሥዋዕት ለማድረግ የሄደበት ተራራ ማን ይባላል?", options: ["ሞሪያ ተራራ", "ሲና ተራራ", "አራራት ተራራ", "ደብረ ታቦር"], correct: 0 },
            { question: "18. እግዚአብሔር ለአብርሃም የገባለት ዋና ቃል ኪዳን ምን ነበር?", options: ["ዘሩ እንደ ሰማይ ኮከብ እንደሚበዛ", "ትልቅ ንጉሥ እንደሚሆን", "ሀብታም እንደሚሆን", "ረጅም ዕድሜ እንደሚኖር"], correct: 0 },
            { question: "19. የአብርሃም የመጀመሪያው ልጅ (ከአጋር የወለደው) ማን ይባላል?", options: ["እስማኤል", "ይስሐቅ", "ያዕቆብ", "ዔሳው"], correct: 0 },
            { question: "20. አብርሃም ከካራን ምድር ሲወጣ ዕድሜው ስንት ነበር?", options: ["50 ዓመት", "75 ዓመት", "100 ዓመት", "120 ዓመት"], correct: 1 },
            { question: "21. ይስሐቅ ያገባትና የያዕቆብና የዔሳው እናት የሆነችው ሴት ማን ትባላለች?", options: ["ርብቃ", "ሳራ", "ራሔል", "ልያ"], correct: 0 },

            { question: "87. በራእይ መጽሐፍ የተጠቀሱት የሰባት አብያተ ክርስቲያናት መብራቶች ምንን ይወክላሉ?", options: ["ሰባቱን አብያተ ክርስቲያናት", "ሰባቱን መላእክት", "ሰባቱን መቅሠፍቶች", "ሰባቱን ከዋክብት"], correct: 0 },
            { question: "88. ኢየሱስ በጌቴሴማኒ የአትክልት ስፍራ ሲጸልይ የነበረው ላብ እንደ ምን ነበር?", options: ["እንደ ታላቅ የደም ነጠብጣብ", "እንደ ውኃ", "እንደ ዘይት", "እንደ እንባ"], correct: 0 },
            { question: "89. ኢየሱስን አሳልፎ የሰጠው ደቀ መዝሙር ይሁዳ እscript በስንት ብር አሳልፎ ሰጠው?", options: ["በ30 የብር ሳንቲም", "በ20 የብር ሳንቲም", "በ50 የብር ሳንቲም", "በ100 የብር ሳንቲም"], correct: 0 },
            { question: "90. ኢየሱስ ከተሰቀለ በኋላ የተከበረው የኢየሩሳሌም ሰው አካሉን ለምኖ በራሱ አዲስ መቃብር ያኖረው ማን ነው?", options: ["የአርማትያስ ዮሴፍ", "ኒቆዲሞስ", "ስምዖን", "ቀያፋ"], correct: 0 },
            { question: "91. በማቴዎስ ወንጌል መሠረት ኢየሱስ ከተጠመቀ በኋላ በመንፈስ ቅዱስ ወደ ምድረ በዳ የተመራው ለምን ነበር?", options: ["በዲያብሎስ ለመፈተን", "ለመጸለይ ብቻ", "ለማስተማር", "ሕዝቡን ለመሸሽ"], correct: 0 },
            { question: "92. በማርቆስ ወንጌል ኢየሱስ 'የሰንበት ጌታ' እንደሆነ ተናግሯል፤ ሰንበት ለሰው ተፈጠረ ወይስ ሰው ለሰንበት?", options: ["ሰንበት ለሰው ተፈጠረ", "ሰው ለሰንበት ተፈጠረ", "ሁለቱም አልተፈጠሩም", "ለ መላእክት ተፈጠረ"], correct: 0 },
            { question: "93. በሉቃስ ወንጌል ኢየሱስ በዛፍ ላይ ወጥቶ ያየው አጭሩ ቀራጭ ማን ይባላል?", options: ["ዘኬዎስ", "ማቴዎስ", "ሌዊ", "ቆርኔሌዎስ"], correct: 0 },
            { question: "94. በዮሐንስ ወንጌል ኢየሱስ በሌሊት መጥቶ ያናገረው የፈሪሳውያን አለቃ ማን ይባላል?", options: ["ኒቆዲሞስ", "ገማልያል", "ቀያፋ", "ሐና"], correct: 0 },
            { question: "95. ጳውሎስ በሮሜ 12:2 ላይ 'ይህንን ዓለም አትምሰሉ፤ ነገር ግን ... ታደሱ' ብሏል?", options: ["በልባችሁ (በአእምሯችሁ) መታደስ", "በልብሳችሁ", "በሀብታችሁ", "በንግግራችሁ"], correct: 0 },
            { question: "96. 1ኛ ቆሮንቶስ 15 እንደሚያስረዳው የክርስቲያን እምነት ከንቱ የሚሆነው የትኛው ካልሆነ ነው?", options: ["ክርስቶስ ከሙታን ካልተነሣ", "ታምራት ካልተደረገ", "ቤተ መቅደስ ካልተሠራ", "ጾም ካልተፆመ"], correct: 0 },
            { question: "97. በኤፌሶን 6:1 ገለጻ መሠረት ልጆች ለወላጆቻቸው በጌታ ምን ማድረግ አለባቸው?", options: ["መታዘዝ አለባቸው", "ገንዘብ መስጠት አለባቸው", "ማስተማር አለባቸው", "ምግብ መስጠት አለባቸው"], correct: 0 },
            { question: "98. በይሁዳ መልእክት መሠረት ሄኖክ በስንተኛው ትውልድ ላይ ሆኖ ነው ስለ ጌታ ምጽአት የተነበየው?", options: ["ሰባተኛው ትውልድ", "አምስተኛው ትውልድ", "አሥረኛው ትውልድ", "አንደኛው ትውልድ"], correct: 0 },
            { question: "99. በራእይ መጽሐፍ መሠረት የሞትና የሲኦል መክፈቻ በእጁ ያለው ማን ነው?", options: ["ኢየሱስ ክርስቶስ", "መልአኩ ሚካኤል", "ሐዋርያው ጴጥሮስ", "ዮሐንስ"], correct: 0 },
            { question: "100. በዮሐንስ ራእይ መጨረሻ ምዕራፍ (22:20) ላይ 'አሜን፤ ጌታ ኢየሱስ ሆይ ...' የሚለው ጸሎት ምንድን ነው?", options: ["ና (ብቅ በል)", "ማረን", "ባርከን", "እርዳን"], correct: 0 }
        ];

        let currentQuestionIndex = 0;
        let currentLevel = 1;
        let levelEndIndex = 25;
        
        let userName = "";
        let timeLeft = 30;
        let timerInterval = null;
        let attemptCount = 0;
        
        let correctAnswersCount = 0;
        let wrongAnswersCount = 0;
        let questionAnsweredFlag = false;

        let unlockedLevels = [true, false, false, false];
        let completedLevels = [false, false, false, false];

        function validateInput() {
            const inputVal = document.getElementById("username-input").value.trim();
            const startBtn = document.getElementById("start-btn");
            if (inputVal.length > 0) {
                startBtn.classList.add("active");
                startBtn.disabled = false;
            } else {
                startBtn.classList.remove("active");
                startBtn.disabled = true;
            }
        }

        function goToLevelSelection() {
            userName = document.getElementById("username-input").value.trim();
            
            const userHeader = document.getElementById("user-header");
            userHeader.innerText = `ውድ የጌታ ልጅ ${userName}`;
            userHeader.style.display = "block";

            document.getElementById("name-section").style.display = "none";
            document.getElementById("level-section").style.display = "block";
            
            updateLevelCardsUI();
        }

        function updateLevelCardsUI() {
            for (let i = 1; i <= 4; i++) {
                const card = document.getElementById(`level-card-${i}`);
                if (unlockedLevels[i - 1]) {
                    card.classList.remove("locked");
                    card.classList.add("unlocked");
                } else {
                    card.classList.add("locked");
                    card.classList.remove("unlocked");
                }

                if (completedLevels[i - 1]) {
                    const crossesDiv = document.getElementById(`crosses-${i}`);
                    crossesDiv.innerHTML = '<span class="cross-bright">✝</span><span class="cross-bright">✝</span><span class="cross-bright">✝</span>';
                }
            }
        }

        function startLevel(lvl) {
            if (!unlockedLevels[lvl - 1]) return;

            currentLevel = lvl;
            currentQuestionIndex = (lvl - 1) * 25;
            levelEndIndex = lvl * 25;

            correctAnswersCount = 0;
            wrongAnswersCount = 0;

            document.getElementById("correct-count").innerText = "0";
            document.getElementById("wrong-count").innerText = "0";

            document.getElementById("level-section").style.display = "none";
            document.getElementById("top-panel").style.display = "flex";
            document.getElementById("game-section").style.display = "block";

            loadQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById("timer-display").innerText = `⏱ ${timeLeft}s`;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer-display").innerText = `⏱ ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!questionAnsweredFlag) {
                        wrongAnswersCount++;
                        document.getElementById("wrong-count").innerText = wrongAnswersCount;
                    }
                    nextQuestion();
                }
            }, 1000);
        }

        function loadQuestion() {
            attemptCount = 0;
            questionAnsweredFlag = false;
            const q = quizData[currentQuestionIndex];
            
            document.getElementById("q-num-display").innerText = `ደረጃ ${currentLevel} | ጥያቄ ${currentQuestionIndex + 1} ከ 100`;
            document.getElementById("question-text").innerText = q.question;
            
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.classList.add("option-btn");
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById("next-btn").style.display = "none";

            startTimer();
        }

        function checkAnswer(selectedIndex, btn) {
            if (questionAnsweredFlag) return;
            const q = quizData[currentQuestionIndex];

            if (selectedIndex === q.correct) {
                questionAnsweredFlag = true;
                clearInterval(timerInterval);
                btn.classList.add("correct");
                disableAllButtons();
                
                correctAnswersCount++;
                document.getElementById("correct-count").innerText = correctAnswersCount;

                document.getElementById("next-btn").style.display = "inline-block";
            } else {
                btn.classList.add("wrong");
                btn.disabled = true;
                attemptCount++;

                if (attemptCount >= 2) {
                    questionAnsweredFlag = true;
                    clearInterval(timerInterval);
                    disableAllButtons();
                    
                    wrongAnswersCount++;
                    document.getElementById("wrong-count").innerText = wrongAnswersCount;

                    setTimeout(() => {
                        nextQuestion();
                    }, 1000);
                }
            }
        }

        function disableAllButtons() {
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(b => b.disabled = true);
        }

        function nextQuestion() {
            clearInterval(timerInterval);
            
            if (!questionAnsweredFlag) {
                questionAnsweredFlag = true;
                wrongAnswersCount++;
                document.getElementById("wrong-count").innerText = wrongAnswersCount;
            }

            currentQuestionIndex++;
            if (currentQuestionIndex < levelEndIndex) {
                loadQuestion();
            } else {
                finishLevel();
            }
        }

        function finishLevel() {
            completedLevels[currentLevel - 1] = true;
            if (currentLevel < 4) {
                unlockedLevels[currentLevel] = true;
            }

            document.getElementById("game-section").style.display = "none";
            document.getElementById("top-panel").style.display = "none";
            document.getElementById("level-section").style.display = "block";

            updateLevelCardsUI();

            if (currentLevel === 4) {
                document.getElementById("level-welcome-text").innerText = `እንኳን ደስ አለዎት ${userName}! አራቱንም ደረጃዎች በተሳካ ሁኔታ አጠናቀዋል።`;
            } else {
                document.getElementById("level-welcome-text").innerText = `እንኳን ደስ አለዎት ${userName}! ደረጃ ${currentLevel}ን አጠናቀዋል። ወደ ቀጣዩ ደረጃ መሸጋገር ይችላሉ።`;
            }
        }
    </script>
</body>
